
name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Verify Render secret exists
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "SUCCESS: Render deploy hook secret is configured."
          else
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing or empty"
            exit 1
          fi
 
      - name: Deploy image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/${{ github.repository }}:${{ github.sha }}
        shell: bash
        run: |
          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL")

          echo "Render HTTP status: $HTTP_STATUS"
          echo "Render response:"
          cat "$RESPONSE_FILE"
          rm -f "$RESPONSE_FILE"

          if [ "$HTTP_STATUS" != "200" ] &&
             [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Render deployment request failed."
            exit 1
          fi

